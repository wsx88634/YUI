<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripTree V13 - 置中精美 Modal 視窗與行程標籤列優化</title>
  <meta name="description" content="專為手機與桌面最佳化的垂直時間軸樹狀心智圖旅遊規劃小工具。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=13.0.0">
</head>
<body>

  <!-- Read-Only Banner for Companion Mode -->
  <div id="readonlyBanner" class="readonly-banner" style="display: none;">
    <span>👀 旅伴唯讀預覽模式（無法修改行程，僅提供查看與地圖導覽）</span>
  </div>

  <!-- Top Header -->
  <header>
    <!-- Top Row: Logo & Action Buttons -->
    <div class="header-top-row">
      <div class="logo-group">
        <div class="logo-icon">🗺️</div>
        <div class="logo-title">TripTree</div>
      </div>

      <div class="nav-actions">
        <!-- Open Personal Spot Vault Drawer -->
        <button class="btn btn-vault" id="btnOpenVault" title="開啟景點資料庫 / 靈感庫">
          <span>📦</span> <span class="btn-text">景點靈感庫</span>
        </button>

        <!-- Share Readonly Link to Companion -->
        <button class="btn btn-share-companion" id="btnShareCompanion" title="複製唯讀網址分享給旅伴看">
          <span>🔗</span> <span class="btn-text">分享旅伴 (唯讀)</span>
        </button>

        <button class="btn" id="btnRefresh" title="手機強制刷新" onclick="localStorage.clear(); location.reload(true);">
          <span>🔄</span> <span class="btn-text">刷新</span>
        </button>
        <button class="btn" id="btnExport" title="匯出 JSON">
          <span>📤</span> <span class="btn-text">匯出</span>
        </button>
        <button class="btn" id="btnImport" title="匯入 JSON">
          <span>📥</span> <span class="btn-text">匯入</span>
        </button>
        <button class="btn btn-primary" id="btnResetDemo" title="重置載入最新行程範例">
          <span>✨</span> <span class="btn-text">重置範例</span>
        </button>
      </div>
    </div>

    <!-- 3. 獨立且可順暢滑動的行程標籤頁面列 (解決被蓋住問題) -->
    <div class="trip-tabs-container">
      <div class="trip-tabs-bar" id="tripTabsBar">
        <!-- Tabs populated via JS -->
      </div>
      <button class="btn-add-tab" id="btnAddTripTab" title="新增行程資料夾">➕ 新增行程</button>
    </div>
  </header>

  <!-- Toolbar Bar -->
  <div class="toolbar">
    <input type="text" id="tripTitleInput" class="trip-title-edit" value="🏮 福岡 3 天 2 夜 櫛田神社輕旅行" placeholder="點擊編輯行程名稱...">
    
    <div class="view-switcher">
      <button class="tab-btn active" id="tabMindmap">🌳 垂直時間軸心智圖</button>
      <button class="tab-btn" id="tabOutline">📱 手機列表視圖</button>
    </div>
  </div>

  <!-- Main View Area -->
  <main id="mainContainer">
    <!-- View 1: Timeline Tree View -->
    <div id="mindmapViewport" class="mindmap-viewport">
      <div id="mindmapCanvas" class="mindmap-canvas">
        <svg id="svgConnectors" class="svg-connectors"></svg>
        <div id="nodesLayer"></div>
      </div>
    </div>

    <!-- View 2: Mobile Outline View -->
    <div id="outlineView" class="outline-view" style="display: none;">
      <div id="outlineTree" class="outline-tree"></div>
    </div>
  </main>

  <!-- 📦 景點資料庫 / 靈感庫 側邊抽屜 Drawer -->
  <div class="vault-drawer" id="vaultDrawer">
    <div class="vault-header">
      <div class="vault-title"><span>📦</span> 個人景點靈感庫</div>
      <div class="vault-header-actions">
        <button class="vault-icon-btn" id="btnToggleFullVault" title="全螢幕檢視 / 側邊抽屜">📖 展能全螢幕</button>
        <button class="vault-close-btn" id="btnCloseVault">&times;</button>
      </div>
    </div>
    <div class="vault-body">
      <!-- AI / 網址貼上快捷建卡盒 -->
      <div class="vault-ai-box">
        <div class="vault-ai-title"><span>✨</span> 貼上網址 / IG / 景點名稱自動建卡</div>
        <input type="text" id="vaultQuickInput" class="vault-input" placeholder="貼上 IG 網址 / Google 地圖連結 / 景點名稱...">
        <div style="display:flex; gap:6px; align-items:center;">
          <select id="vaultTargetRegion" class="form-select" style="font-size:0.8rem; padding:4px 8px;">
            <option value="福岡">🇯🇵 福岡</option>
            <option value="東京">🇯🇵 東京</option>
            <option value="大阪">🇯🇵 大阪</option>
            <option value="京都">🇯🇵 京都</option>
            <option value="奈良">🇯🇵 奈良</option>
          </select>
          <button class="vault-gen-btn" id="btnGenVaultCard">+ 存入景點庫</button>
        </div>
      </div>

      <!-- 地區分類篩選獨立面板 -->
      <div class="vault-filter-bar">
        <div class="vault-filter-header">
          <span style="font-size:0.85rem; font-weight:800; color:#0f766e;">📍 地區分類篩選：</span>
          <button class="btn-add-region" id="btnAddRegionTag">+ 新增地區</button>
        </div>
        <div class="vault-region-tabs" id="vaultRegionTabs">
          <!-- Region chips rendered via JS -->
        </div>
      </div>

      <!-- 景點卡片清單 -->
      <div class="vault-card-list" id="vaultCardList">
        <!-- Vault cards rendered via JS -->
      </div>
    </div>
  </div>

  <!-- ✨ 2. 置中精美 Modal: 創建全新行程資料夾 (整合名稱、日期、天數) -->
  <div class="modal-overlay" id="newTripModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title"><span>✨</span> 創建全新行程資料夾</h3>
        <button class="close-btn" id="btnCloseNewTripModal">&times;</button>
      </div>

      <form id="newTripForm">
        <div class="form-group">
          <label class="form-label" for="newTripTitle">行程名稱 *</label>
          <input type="text" id="newTripTitle" class="form-input" placeholder="例如：東京 5 天 4 夜自由行" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="newTripStartDate">出發日期 *</label>
          <input type="date" id="newTripStartDate" class="form-input" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="newTripDays">旅行天數 *</label>
          <input type="number" id="newTripDays" class="form-input" min="1" max="30" value="5" required>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
          <button type="button" class="btn" id="btnCancelNewTrip">取消</button>
          <button type="submit" class="btn btn-primary">🚀 立即自動生成分支</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ✨ 1. 置中精美 Modal: 選擇景點放置位置 (取代醜陋 Prompt 數字輸入) -->
  <div class="modal-overlay" id="placementModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="placementModalTitle"><span>📍</span> 選擇景點放置位置</h3>
        <button class="close-btn" id="btnClosePlacementModal">&times;</button>
      </div>

      <div style="font-size:0.9rem; color:#475569; font-weight:600;" id="placementSpotTargetName">
        請選擇要把景點放入哪一天的哪個時段：
      </div>

      <div class="placement-options-list" id="placementOptionsList">
        <!-- Placement options buttons rendered via JS -->
      </div>
    </div>
  </div>

  <!-- Floating Manual Zoom Control Panel -->
  <div class="zoom-controls-widget" id="zoomWidget">
    <button class="zoom-btn" id="btnZoomOut" title="縮小 (Ctrl + 滾輪向下)">− </button>
    <div class="zoom-display" id="zoomDisplay" title="點擊重置為 100%">100%</div>
    <button class="zoom-btn" id="btnZoomIn" title="放大 (Ctrl + 滾輪向上)">+</button>
  </div>

  <!-- Floating Add Node Button -->
  <button class="fab-btn" id="fabAdd" title="新增景點節點">+</button>

  <!-- Hidden File Input for JSON Import -->
  <input type="file" id="fileImportInput" accept=".json" style="display: none;">

  <!-- Modal Component: Add / Edit Node -->
  <div class="modal-overlay" id="nodeModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">新增景點 / 節點</h3>
        <button class="close-btn" id="modalClose">&times;</button>
      </div>

      <form id="nodeForm">
        <input type="hidden" id="nodeId">
        <input type="hidden" id="nodeParentId">

        <div class="form-group">
          <label class="form-label" for="nodeCategory">節點類型</label>
          <select id="nodeCategory" class="form-select" required>
            <option value="day">📅 日期 / 天數 (Day 1: 10/20 成田機場)</option>
            <option value="period">🕒 時段膠囊 (上午/中午/下午/晚上)</option>
            <option value="spot" selected>📍 景點 / 行程動作</option>
            <option value="food">🍜 美食 / 餐廳</option>
            <option value="hotel">🏨 住宿 / 飯店</option>
            <option value="shop">🛍️ 購物 / 商圈</option>
            <option value="transit">🚌 交通 / 班次</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">卡片背景顏色 (自由配色)</label>
          <div class="color-picker-grid" id="colorPickerGrid">
            <div class="color-swatch active" data-color="#ffffff" style="background:#ffffff; border:1px solid #ccc;"></div>
            <div class="color-swatch" data-color="#fef3c7" style="background:#fef3c7;"></div>
            <div class="color-swatch" data-color="#fef08a" style="background:#fef08a;"></div>
            <div class="color-swatch" data-color="#bbf7d0" style="background:#bbf7d0;"></div>
            <div class="color-swatch" data-color="#dcfce7" style="background:#dcfce7;"></div>
            <div class="color-swatch" data-color="#ffedd5" style="background:#ffedd5;"></div>
            <div class="color-swatch" data-color="#e0e7ff" style="background:#e0e7ff;"></div>
            <div class="color-swatch" data-color="#fecdd3" style="background:#fecdd3;"></div>
            <input type="color" id="nodeColorCustom" value="#ffffff" style="width:32px; height:32px; border:none; background:transparent; cursor:pointer;">
          </div>
          <input type="hidden" id="nodeColor" value="#ffffff">
        </div>

        <div class="form-group">
          <label class="form-label" for="nodeTitle">景點 / 節點名稱 *</label>
          <input type="text" id="nodeTitle" class="form-input" placeholder="例如：14:30 澀谷 SHIBUYA SKY 展望台" required>
        </div>

        <div id="hotelFieldsBox" class="hotel-fields-box" style="display: none;">
          <div class="form-group">
            <label class="form-label">入住時間 / 退房時間</label>
            <div style="display:flex; gap:8px;">
              <input type="text" id="hotelCheckIn" class="form-input" placeholder="入住 (如 15:00 入住)">
              <input type="text" id="hotelCheckOut" class="form-input" placeholder="退房 (如 11:00 退房)">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="hotelRoomType">房型 / 訂房確認號</label>
            <input type="text" id="hotelRoomType" class="form-input" placeholder="例如：上野雷門大飯店 #TK8829">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="nodeUrl">網址 / 官網連結</label>
          <input type="url" id="nodeUrl" class="form-input" placeholder="https://example.com">
        </div>

        <div class="form-group">
          <label class="form-label" for="nodeMapsUrl">Google 地圖連結</label>
          <input type="url" id="nodeMapsUrl" class="form-input" placeholder="https://maps.google.com/...">
        </div>

        <div class="form-group">
          <label class="form-label" for="nodeImageUrl">照片 / 圖片網址</label>
          <input type="url" id="nodeImageUrl" class="form-input" placeholder="https://images.unsplash.com/...">
        </div>

        <div class="form-group">
          <label class="form-label" for="nodeCost">預算 / 時間標註</label>
          <input type="text" id="nodeCost" class="form-input" placeholder="例如：¥1,100 或 41分鐘直達">
        </div>

        <div class="form-group">
          <label class="form-label" for="nodeNote">筆記 / 說明備註</label>
          <textarea id="nodeNote" class="form-textarea" placeholder="填寫景點指引、美食推薦等資訊..."></textarea>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
          <button type="button" class="btn" id="btnCancelModal">取消</button>
          <button type="submit" class="btn btn-primary" id="btnSaveNode">保存節點</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js?v=13.0.0"></script>
</body>
</html>
